services:
  fileservice:
    build:
      context: .
      dockerfile: Dockerfile
    image: fileservice:latest
    container_name: fileservice
    ports:
      - "8091:8091"
    networks:
      - dokploy-network
      - updated_orgadmin_rmscadminnetwork
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx384m -Xms256m"
      # Server port
      SERVER_PORT: 8091

      # Eureka Configuration
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://serviceregistry:8761/eureka
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "true"
      EUREKA_CLIENT_FETCH_REGISTRY: "true"
      EUREKA_INSTANCE_LEASE_RENEWAL_INTERVAL_IN_SECONDS: "10"
      EUREKA_INSTANCE_LEASE_EXPIRATION_DURATION_IN_SECONDS: "30"
      EUREKA_INSTANCE_ENABLE_SELF_PRESERVATION: "false"

      # Spring Actuator Endpoints
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,eureka,shutdown

      # External MySQL DB Configuration
      SPRING_DATASOURCE_URL: jdbc:mysql://smartedu-erp-school-erp-0gieai:3306/schoolerp?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Helixion@2026
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

      # AWS S3 Configuration
      AWS_ACCESS_KEY: AKIAQSOI4DVT5AUHF36O
      AWS_SECRET_KEY: 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
      AWS_REGION: ap-south-1
      AWS_S3_BUCKET: surpassingbucket

    restart: on-failure

networks:
  dokploy-network:
    external: true
  updated_orgadmin_rmscadminnetwork:
    external: true
